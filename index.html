<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>game vip</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--box:#000;--txt:#fff;--bd:#333;--bd2:#666}
html,body{background:linear-gradient(160deg,#8e2de2 0%,#6a1b9a 45%,#4a00e0 100%);background-attachment:fixed;color:#fff}
body{font-family:system-ui,sans-serif;padding:12px;min-height:100vh;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
.hidden{display:none!important}
/* ===== MÀN HÌNH MẬT KHẨU: full đen ===== */
#login{position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.pw-wrap{position:relative;width:82%;max-width:340px;margin-bottom:14px}
.pw-wrap input{width:100%;padding:15px 46px 15px 14px;background:#000;color:#fff;border:1px solid var(--bd);border-radius:8px;font-size:17px;outline:none}
.pw-wrap input:focus{border-color:var(--bd2)}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#9aa4b2;padding:4px}
.eye svg{width:22px;height:22px;display:block}
#login .btn{flex:0 0 auto;width:82%;max-width:340px;padding:13px;background:#000;color:#fff;border:1px solid var(--bd2);border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
#pwErr{margin-top:12px;font-size:14px;color:#fff;opacity:.75;display:none}

/* ===== HEADER + MENU 3 GẠCH ===== */
.header{display:flex;align-items:center;justify-content:space-between;max-width:480px;margin:0 auto 12px;background:#000}
.header-left{display:flex;align-items:center;gap:12px}
.menu-btn{font-size:26px;background:#000;color:#fff;border:none;padding:6px 10px;cursor:pointer;line-height:1}
.title{font-size:19px;font-weight:700;color:#fff}
#mode{font-size:13px;color:#fff;opacity:.8}
#sideMenu{position:fixed;top:0;left:-270px;width:270px;height:100%;background:#000;border-right:1px solid var(--bd);z-index:10000;transition:.25s;padding-top:64px}
#sideMenu.open{left:0}
#sideMenu .close{position:absolute;top:14px;right:16px;font-size:22px;color:#fff;cursor:pointer;background:none;border:none}
.menu-item{padding:18px 20px;color:#fff;font-size:17px;border-bottom:1px solid var(--bd);cursor:pointer}
.menu-item:active{background:#111}
#menuShade{position:fixed;inset:0;background:#000;opacity:.6;z-index:9999;display:none}

/* ===== ĐỔI MẬT KHẨU: đen, chữ trắng ===== */
#changePass{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;max-width:340px;background:#000;border:1px solid var(--bd2);border-radius:10px;padding:22px;z-index:10001;display:none}
#changePass h3{font-size:17px;text-align:center;margin-bottom:18px;color:#fff}
#changePass .pw-wrap{width:100%;margin-bottom:12px}
#changePass .btn{width:100%;margin-top:6px;padding:13px;background:#000;color:#fff;border:1px solid var(--bd2);border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
#changePass .btn.ghost{border-color:var(--bd);font-weight:400;opacity:.8}

/* ===== KHUNG: TẤT CẢ ĐEN, CHỮ TRẮNG ===== */
.container{max-width:480px;margin:0 auto}
.card{background:#000;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.banner{background:#000;border:1px solid var(--bd);color:#fff;padding:10px;border-radius:8px;margin-bottom:10px;font-size:13px;display:none;line-height:1.5}
label{display:block;font-size:13px;color:#fff;opacity:.75;margin:8px 0 4px;font-weight:600}
input{width:100%;padding:10px;background:#000;border:1px solid var(--bd);border-radius:8px;color:#fff;font-size:16px;outline:none}
input:focus{border-color:var(--bd2)}
input::placeholder{color:#fff;opacity:.35}
.preview{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;min-height:26px}
.chip{padding:2px 8px;border-radius:4px;font-size:13px;font-weight:600;background:#000;color:#fff;border:1px solid var(--bd)}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.kb button{padding:10px 2px;font-size:15px;background:#000;color:#fff;border:1px solid var(--bd);border-radius:6px;cursor:pointer}
.kb button:active{background:#111;border-color:var(--bd2)}
.kb button.del{border-color:var(--bd2)}
.btnrow{display:flex;gap:8px;margin:10px 0}
button{flex:1;padding:12px;border:1px solid var(--bd);border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;background:#000;color:#fff}
button.main{border-color:var(--bd2)}
button:disabled{opacity:.45}
.block{background:#000;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:6px 0;font-size:14px;white-space:pre-wrap;line-height:1.6;color:#fff}
.rt{font-weight:700;font-size:14px;margin:10px 0 4px;border-bottom:1px solid var(--bd);padding-bottom:4px;color:#fff}
/* Khung suy nghĩ TO */
#rThink{min-height:190px;max-height:340px;overflow-y:auto;font-size:15px}
.advice{padding:10px;border-radius:8px;margin:8px 0;font-size:14px;font-weight:600;line-height:1.6;background:#000;border:1px solid var(--bd);color:#fff}
.concl{text-align:center;font-size:23px;font-weight:700;padding:16px 10px;border-radius:8px;margin:10px 0;background:#000;border:1px solid var(--bd2);color:#fff;letter-spacing:.5px}
.concl small{display:block;font-size:12px;font-weight:400;opacity:.7;letter-spacing:0;margin-bottom:6px}
#rPct{text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.stat{background:#000;border:1px solid var(--bd);border-radius:6px;padding:8px;text-align:center}
.sv{font-size:18px;font-weight:700;color:#fff}.sl{font-size:11px;color:#fff;opacity:.65}
.cau-box{background:#000;border:1px solid var(--bd2);border-radius:8px;padding:10px;margin-bottom:10px}
.cau-title{font-size:13px;color:#fff;opacity:.75;margin-bottom:6px;font-weight:600}
.cau-hist{display:flex;flex-direction:column-reverse;gap:4px;max-height:180px;overflow-y:auto}
.cau-row{font-size:15px;padding:4px 0;border-bottom:1px solid var(--bd);white-space:pre-wrap;line-height:1.6;color:#fff}
.cau-row.new{border-left:3px solid #fff;padding-left:6px}
.cau-hint{font-size:12px;color:#fff;opacity:.65;margin-top:6px;line-height:1.5}
.ai-note{font-size:11px;color:#fff;opacity:.55;margin-top:6px;line-height:1.5}
.hist-pred{margin-top:10px;max-height:260px;overflow-y:auto;font-size:13px;background:#000;border:1px solid var(--bd);border-radius:8px;padding:8px}
.hi-item{padding:8px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.hi-main{display:flex;justify-content:space-between;align-items:center;gap:6px;color:#fff}
.hi-actions{display:flex;gap:4px}
.hi-actions button{flex:1;padding:6px 8px;font-size:12px;border-radius:4px;border:1px solid var(--bd2);background:#000;color:#fff;cursor:pointer;font-weight:700}
.hi-done{font-size:12px;padding:4px 8px;border-radius:4px;background:#000;border:1px solid var(--bd);color:#fff;opacity:.8}
.hi-note{font-size:11px;color:#fff;opacity:.55}
#load{display:none;text-align:center;padding:14px;font-size:14px;color:#fff;opacity:.8}
#bar{height:6px;background:#000;border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
#fill{height:100%;width:0;background:#fff;transition:width .2s}
#alertBox{display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--bd2);color:#fff;padding:11px 18px;border-radius:8px;z-index:20000;font-size:14px;max-width:88vw;text-align:center}

/* ===== GIAO DIỆN CHÍNH: nền vẫn ĐEN, chữ vẫn TRẮNG, nhưng viền sáng + nhấn màu để dễ nhìn ===== */
/* Chỉ áp trong #mainApp → màn hình mật khẩu, đổi mật khẩu, menu GIỮ NGUYÊN như cũ */
#mainApp{--mBd:#5b6472;--mBd2:#c6d0de;--accent:#8ab4f8}
#mainApp .header{border-bottom:1px solid var(--mBd);padding-bottom:10px}
#mainApp .menu-btn{border:none;padding:6px 10px;font-size:28px;color:var(--accent)}
#mainApp .title{font-size:21px;letter-spacing:.3px}
#mainApp #mode{opacity:1;color:var(--accent)}
#mainApp .card{border:1.5px solid var(--mBd2);border-radius:12px}
#mainApp label{font-size:14px;opacity:1;color:var(--mBd2);letter-spacing:.2px;font-weight:700}
#mainApp input{border:1.5px solid var(--mBd2);background:#050505;font-size:17px}
#mainApp input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(138,180,248,.18)}
#mainApp input::placeholder{opacity:.28}
#mainApp .chip{border:1.5px solid var(--mBd2)}
#mainApp .kb button{border:1.5px solid var(--mBd2);font-size:16px;padding:11px 2px}
#mainApp .kb button.del{border-color:var(--accent);color:var(--accent)}
#mainApp button{border:1.5px solid var(--mBd2);padding:13px 10px}
#mainApp button.main{border-color:var(--accent);color:var(--accent)}
#mainApp #go{background:#070d18;border-color:var(--accent);color:var(--accent);font-size:18px;letter-spacing:1px}
#mainApp .block,#mainApp .advice,#mainApp .concl,#mainApp .stat,#mainApp .cau-box,#mainApp .hist-pred,#mainApp .banner{border:1.5px solid var(--mBd2)}
#mainApp .rt{border-bottom:1.5px solid var(--mBd2);color:var(--mBd2);font-size:15px}
#mainApp #rThink{border-color:var(--accent);font-size:15px}
#mainApp .concl{color:var(--accent);font-size:25px}
#mainApp .cau-row.new{border-left-color:var(--accent)}
#mainApp .sv{color:var(--accent)}
#mainApp .sl,#mainApp .cau-hint,#mainApp .ai-note,#mainApp .hi-note{opacity:.85}
#mainApp #bar{border-color:var(--mBd2)}
#mainApp .hi-actions button{border-color:var(--mBd2)}
#mainApp .btnrow{gap:10px}
#tkStat{color:var(--accent);opacity:.85;font-size:13px;margin-top:10px;border-top:1px dashed var(--mBd);padding-top:8px}

/* ===== MÀU ẢNH 4 (Play & Earn): CHỈ ĐỔI MÀU, giữ nguyên bố cục =====
   Chỉ áp trong #mainApp → màn nhập mật khẩu, đổi mật khẩu, menu vẫn đen tuyền như cũ */
#mainApp{--mBd:#b98ae8;--mBd2:#e6d4ff;--accent:#f0d9ff;background:transparent;color:#fff}
#mainApp .header{background:transparent;border-bottom-color:rgba(255,255,255,.55)}
#mainApp .menu-btn,#mainApp .title,#mainApp #mode{color:#fff}
#mainApp .card,#mainApp .cau-box,#mainApp .block,#mainApp .advice,#mainApp .concl,
#mainApp .stat,#mainApp .hist-pred,#mainApp .banner,#mainApp #bar{
  background:rgba(28,0,58,.42);border-color:#e6d4ff;color:#fff
}
#mainApp input{background:rgba(18,0,42,.55);border-color:#e6d4ff;color:#fff}
#mainApp input:focus{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
#mainApp input::placeholder{color:#fff;opacity:.45}
#mainApp .chip{background:rgba(18,0,42,.55);border-color:#e6d4ff;color:#fff}
#mainApp .kb button,#mainApp button{background:#7b2ff7;border-color:#e6d4ff;color:#fff}
#mainApp .kb button:active,#mainApp button:active{background:#9b4dff}
#mainApp button.main,#mainApp #go{background:#7b2ff7;border-color:#fff;color:#fff}
#mainApp #go{background:#5a00c9;border-color:#fff;color:#fff}
#mainApp .kb button.del{border-color:#fff;color:#fff}
#mainApp label,#mainApp .rt{color:#f0d9ff}
#mainApp .rt{border-bottom-color:rgba(255,255,255,.5)}
#mainApp .concl,#mainApp .sv,#mainApp .stat .sv{color:#fff}
#mainApp .cau-row{border-bottom-color:rgba(255,255,255,.35);color:#fff}
#mainApp .cau-row.new{border-left-color:#fff}
#mainApp .cau-hint,#mainApp .ai-note,#mainApp .hi-note,#mainApp .sl{color:#fff;opacity:.9}
#mainApp #rThink{border-color:#fff;background:rgba(18,0,42,.55);color:#fff}
#mainApp #fill{background:#f0d9ff}
#mainApp .hi-actions button{background:#7b2ff7;border-color:#e6d4ff;color:#fff}
#mainApp #tkStat{color:#f0d9ff;border-top-color:rgba(255,255,255,.45)}
#mainApp .hi-item{border-bottom-color:rgba(255,255,255,.3)}

/* ============================================================
   MÀU Y CHANG ẢNH 1 (Play & Earn) · CHỈ ĐỔI MÀU
   · Không đụng bố cục, không đụng HTML, không đụng JS
   · Màn khoá / Đổi mật khẩu / Menu 3 gạch vẫn đen tuyền như cũ
   · Chỉ áp trong #mainApp
   ============================================================ */
html,body{
  background:linear-gradient(180deg,#9333EA 0px,#7B1FA2 96px,#F4F4F7 96px,#F4F4F7 100%) no-repeat #F4F4F7 !important;
  background-attachment:scroll !important;
  color:#fff !important;                 /* giữ chữ trắng cho màn khoá */
}
#mainApp{color:#1A1A1F !important;background:transparent !important}

/* Dải tím trên cùng = header "Play & Earn" */
#mainApp .header{background:transparent !important;border-bottom:none !important}
#mainApp .menu-btn{background:transparent !important;color:#fff !important}
#mainApp .title{color:#fff !important}
#mainApp #mode{color:rgba(255,255,255,.85) !important}

/* Thẻ trắng · chữ đen · bóng cực nhạt */
#mainApp .card,#mainApp .cau-box,#mainApp .block,#mainApp .hist-pred,
#mainApp .stat,#mainApp .banner{
  background:#FFFFFF !important;border-color:#EDE7F6 !important;color:#1A1A1F !important;
  box-shadow:0 2px 10px rgba(80,20,140,.07) !important;
}
#mainApp .advice{background:#F7F0FF !important;border-color:#EDE7F6 !important;color:#1A1A1F !important}
#mainApp .concl{background:#FFFFFF !important;border-color:#EDE7F6 !important;color:#7B1FA2 !important}
#mainApp .concl small{color:#8A8A93 !important}

/* Chữ trong thẻ */
#mainApp label,#mainApp .rt{color:#6B6B75 !important}
#mainApp .rt{border-bottom-color:#EDE7F6 !important}
#mainApp .cau-title,#mainApp .cau-hint,#mainApp .ai-note,#mainApp .hi-note,
#mainApp .sl,#mainApp #tkStat{color:#8A8A93 !important}
#mainApp #tkStat{border-top-color:#EDE7F6 !important}
#mainApp .cau-row{color:#1A1A1F !important;border-bottom-color:#F0ECF7 !important}
#mainApp .cau-row.new{border-left-color:#7B2FF7 !important}
#mainApp .hi-item{border-bottom-color:#F0ECF7 !important}
#mainApp .hi-main,#mainApp .block,#mainApp #rPct,#mainApp .preview{color:#1A1A1F !important}
#mainApp .hi-done{background:#F7F0FF !important;border-color:#EDE7F6 !important;color:#4A4A55 !important}

/* Ô nhập: trắng, chữ đen, viền tím nhạt */
#mainApp input{background:#FBFBFD !important;border-color:#E6D4FF !important;color:#1A1A1F !important}
#mainApp input:focus{border-color:#7B2FF7 !important;box-shadow:0 0 0 2px rgba(123,47,247,.15) !important}
#mainApp input::placeholder{color:#A9A9B2 !important;opacity:1 !important}
#mainApp .chip{background:#F3E8FF !important;border-color:#E6D4FF !important;color:#7B1FA2 !important}

/* Bàn phím: nền trắng, chữ tím (kiểu icon tròn ảnh 1) */
#mainApp .kb button{background:#FFFFFF !important;border-color:#E6D4FF !important;color:#7B1FA2 !important}
#mainApp .kb button:active{background:#F3E8FF !important}
#mainApp .kb button.del{background:#F3E8FF !important;border-color:#D9C2F5 !important;color:#7B1FA2 !important}

/* Nút = nút "Play" tím ảnh 1 */
#mainApp button,#mainApp button.main,#mainApp .hi-actions button{
  background:#7B1FA2 !important;border-color:#7B1FA2 !important;color:#FFFFFF !important;
}
#mainApp button:active{background:#6A1B9A !important}
#mainApp #go{background:#6A1B9A !important;border-color:#6A1B9A !important;color:#FFFFFF !important}
#mainApp button:disabled{opacity:.5 !important}

/* Số liệu = xanh ngọc giống "$20.1492 / +$0.0385" */
#mainApp .sv,#mainApp .stat .sv{color:#00B08F !important}

/* Thanh tiến độ = track tím nhạt */
#mainApp #bar{background:#EDE4F7 !important;border-color:#EDE4F7 !important}
#mainApp #fill{background:#7B2FF7 !important}
#mainApp #rThink{background:#FFFFFF !important;border-color:#EDE7F6 !important;color:#1A1A1F !important}
#mainApp #load,#mainApp #loadtext,#mainApp #detail{color:#6B6B75 !important}
#alertBox{background:#7B1FA2 !important;border-color:#7B1FA2 !important;color:#FFFFFF !important}





/* ============================================================
   KHUNG CẦU NGANG · TỰ LÀM LẠI TỪ ĐẦU
   · Bảng NGANH: 6 hàng x N cột, kéo sang ngang, KHÔNG phải bảng dọc
   · Mỗi ô là 1 DOM div có viền vàng -> nhìn thấy ngay dù chưa nhập số
   · Cột ĐẦU TIÊN (số đầu tiên) nằm NGOÀI CÙNG BÊN TRÁI
   · Số chạy TRÊN XUỐNG, đầy 6 ô tự mở cột mới sang PHẢI
   · Bóng ghi CẢ SỐ + KÝ HIỆU: 3X / 11T · 3-10 = Xỉu(X) · 11-18 = Tài(T)
   · Bảng không bao giờ hết
   ============================================================ */
#mainApp .board-wrap{
  background:#FFFFFF!important;border:1px solid #EDE7F6!important;border-radius:10px!important;
  padding:8px!important;overflow-x:auto!important;overflow-y:hidden!important;
  -webkit-overflow-scrolling:touch!important;max-width:100%!important;
}
#mainApp .board{
  display:flex!important;flex-direction:row!important;align-items:stretch!important;
  width:max-content!important;background:#3E2A20!important;
  border:2px solid #D4AF37!important;border-radius:12px!important;
  padding:0!important;margin:0!important;overflow:hidden!important;
}
#mainApp .bcol{
  display:flex!important;flex-direction:column!important;
  width:50px!important;min-width:50px!important;
  border-right:1px solid rgba(212,175,55,.6)!important;padding:0!important;margin:0!important;
}
#mainApp .bcol:last-child{border-right:none!important}
#mainApp .bcol.cur{background:rgba(212,175,55,.07)!important}
#mainApp .bcell{
  width:50px!important;height:50px!important;min-height:50px!important;
  border:0!important;border-bottom:1px solid rgba(212,175,55,.6)!important;
  border-radius:0!important;margin:0!important;padding:0!important;background:transparent!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
}
#mainApp .bcell:nth-child(6){border-bottom:none!important}
#mainApp .ball{
  width:40px!important;height:40px!important;border-radius:50%!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
  font-size:12px!important;font-weight:800!important;line-height:1!important;
  letter-spacing:-.4px!important;border:2px solid #D4AF37!important;
}
#mainApp .ball.x{background:#FFFFFF!important;color:#1A1A1F!important;border-color:#FFFFFF!important;
  box-shadow:0 0 0 1px rgba(212,175,55,.7)!important}
#mainApp .ball.t{background:#3E2A20!important;color:#FFE07A!important;border-color:#FFD54F!important;
  box-shadow:inset 0 0 0 2px rgba(212,175,55,.45)!important}
#mainApp .board-legend{font-size:12px!important;color:#8A8A93!important;margin-top:6px!important;line-height:1.5!important}

/* ===== BỔ SUNG: bàn phím sát bảng, nút Lưu cầu / Xoá từng cột ===== */
#mainApp .kb{margin-top:4px!important}
#mainApp .card .btnrow{margin-top:10px}
#mainApp .cau-title{line-height:1.5}

/* ============================================================
   TỔNG HỢP LẦN CUỐI: xoá chữ nhỏ · kéo khung sát nhau · dễ bấm
   · 4 nút thành lưới 2x2 ngay dưới bảng:
       [Chuyển hàng]   [Xoá cầu]
       [Lưu cầu]       [Xoá từng cột]
   ============================================================ */
body{padding:8px!important}
#mainApp .header{margin:0 auto 8px!important;padding-bottom:8px!important}
#mainApp .container>.card{margin-bottom:8px!important;padding:10px!important;border-radius:10px!important}
#mainApp .cau-box{padding:0!important;margin:0 0 6px!important;border:none!important;background:transparent!important;box-shadow:none!important}
#mainApp .board-wrap{padding:4px!important;margin:0!important;border-radius:8px!important}
#mainApp .cau-hint,#mainApp .board-legend,#mainApp .cau-title,#mainApp .ai-note{display:none!important}
#mainApp .btn-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;margin-top:8px!important}
#mainApp .btn-grid button{margin:0!important;min-height:46px;width:100%}
#mainApp .btnrow{margin:6px 0!important;gap:8px!important}
#mainApp .kb{margin:4px 0 6px!important;gap:6px!important}
#mainApp .kb button{padding:12px 2px!important;font-size:17px!important;min-height:46px}
#mainApp button{padding:12px 8px!important;min-height:46px}

#mainApp .rt{margin:8px 0 4px!important}

(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
  document.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(e.key==='F12'||
       (e.ctrlKey&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||
       (e.ctrlKey&&(k==='u'||k==='s'||k==='r'))||
       (e.metaKey&&(k==='s'||k==='r'))){
      e.preventDefault();return false;

const DEFAULT_PASS='Quanpro2212';
function getPass(){try{return localStorage.getItem(PASS_KEY)||DEFAULT_PASS}catch(e){return DEFAULT_PASS}}
function setPass(v){try{localStorage.setItem(PASS_KEY,v)}catch(e){}}
/* Icon mắt gạch chéo (mặc định) ↔ mắt mở. Cùng kiểu SVG xám, không dùng emoji */

    : a+'<path d="M2 12s3.5-8 10-8 10 8 10 8-3.5 8-10 8-10-8-10-8Z"/><circle cx="12" cy="12" r="3"/></svg>';

<script type="module">
const $=id=>document.getElementById(id);
const banner=$('banner'),load=$('load'),fill=$('fill'),detail=$('detail'),loadtext=$('loadtext');
const isLocal=location.protocol==='file:'||location.protocol==='content:';
function say(msg){banner.style.display='block';banner.textContent=msg;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const mem={};
const LS={get(k){try{return localStorage.getItem(k)??mem[k]??null}catch(e){return mem[k]??null}},
          set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},
          del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
let HIST=[];try{HIST=JSON.parse(LS.get('tx_hist')||'[]')}catch(e){HIST=[]}
let STATS={};try{STATS=JSON.parse(LS.get('tx_stats')||'{}')}catch(e){STATS={}}
let OKN=parseInt(LS.get('tx_ok')||'0',10)||0;
let TOTN=parseInt(LS.get('tx_tot')||'0',10)||0;
let showAll=false;
if(isLocal)say('Đang mở từ bộ nhớ máy. Engine lai chạy hoàn toàn offline nên vẫn dùng được; kéo lên Netlify nếu muốn có link https để chia sẻ.');

/* ============================================================
   BẢNG CẦU NGANG · 6 hàng x N cột · KHÔNG BAO GIỜ HẾT
   · Cột đầu (số đầu tiên) nằm NGOÀI CÙNG BÊN TRÁI
   · Số chạy TRÊN XUỐNG, đầy 6 ô tự mở cột mới sang PHẢI
   · 3-10 = Xỉu (X, bóng trắng) · 11-18 = Tài (T, bóng vàng)
   · AI đọc TRÁI→PHẢI, trong cột TRÊN→XUỐNG, con cuối = hiện tại
   ============================================================ */
const MAX_ROWS=6,CELL=50,MIN_COLS=14;
let COLS=[[]];
const sideOf=n=>n>=11?'T':'X';
const labelOf=o=>o.n+o.side;
const flatObjs=()=>COLS.reduce((a,c)=>a.concat(c),[]);
const boardNums=()=>flatObjs().map(o=>o.n);

function saveBoard(){LS.set('tx_board',JSON.stringify({cols:COLS}));}
function loadBoard(){
  try{
    const b=JSON.parse(LS.get('tx_board')||'null');
    if(b&&Array.isArray(b.cols)&&b.cols.length){
      COLS=b.cols.map(c=>Array.isArray(c)
        ? c.filter(o=>o&&typeof o.n==='number'&&o.n>=3&&o.n<=18).map(o=>({n:o.n,side:sideOf(o.n)}))
        : []);
      if(!COLS.length)COLS=[[]];
      return;
    }
  }catch(e){}
  try{
    const old=JSON.parse(LS.get('tx_cau')||'[]');
    (old.join(' ').match(/\d+/g)||[]).map(Number).filter(n=>n>=3&&n<=18).forEach(n=>addNum(n,true));
    saveBoard();
  }catch(e){}
}
function shiftCol(){
  COLS.push([]);renderBoard();saveBoard();
  say('Đã chuyển hàng. Cột mới sang bên PHẢI, nhập tiếp từ TRÊN XUỐNG.');
}
function addNum(n,quiet){
  n=Number(n);if(!(n>=3&&n<=18))return;
  let c=COLS[COLS.length-1];
  if(c.length>=MAX_ROWS){COLS.push([]);c=COLS[COLS.length-1];}
  c.push({n:n,side:sideOf(n)});
  renderBoard();if(!quiet)saveBoard();
}
/* X trên bàn phím = XOÁ TỪNG CỘT (xoá sạch cột đang có số, lùi về cột trước) */
function removeCurrentColumn(){
  if(COLS.length>1&&COLS[COLS.length-1].length===0)COLS.pop();
  const c=COLS[COLS.length-1];
  if(!c||!c.length){say('Bảng đang trống, không có cột để xoá.');return;}
  const first=labelOf(c[0]),last=labelOf(c[c.length-1]);
  const removed=c.length,colNo=COLS.length;
  COLS.pop();
  if(!COLS.length)COLS=[[]];
  renderBoard();saveBoard();
  const prev=COLS[COLS.length-1];
  say(`Đã xoá cột ${colNo}: bỏ ${removed} số, từ ${last} ngược lên ${first}. Lùi về cột ${COLS.length}${prev.length?' (số cuối '+labelOf(prev[prev.length-1])+')':' (trống)'}. Bấm tiếp để xoá tiếp cột đó.`);
}
function clearBoard(){
  COLS=[[]];renderBoard();saveBoard();
  $('res').style.display='none';
  say('Đã xoá toàn bộ cầu. Bộ nhớ học vẫn giữ nguyên.');
}
function renderBoard(){
  const b=$('board');
  const total=Math.max(MIN_COLS,COLS.length+2);
  if(b.replaceChildren)b.replaceChildren();else b.innerHTML='';
  for(let k=0;k<total;k++){
    const col=COLS[k]||[];
    const d=document.createElement('div');
    d.className='bcol'+(k===COLS.length-1&&COLS.length?' cur':'');
    for(let r=0;r<MAX_ROWS;r++){
      const cell=document.createElement('div');
      cell.className='bcell';
      const o=col[r];
      if(o){
        const ball=document.createElement('div');
        ball.className='ball '+o.side.toLowerCase();
        ball.textContent=labelOf(o);
        ball.title=labelOf(o)+' · '+(o.side==='T'?'Tài':'Xỉu');
        cell.appendChild(ball);
      }
      d.appendChild(cell);
    }
    b.appendChild(d);
  }
  try{
    const w=document.querySelector('.board-wrap');
    /* Luôn giữ cột ĐẦU TIÊN ở bên TRÁI: không tự cuộn sang phải làm khuất số đầu */
    if(w)w.scrollLeft=0;
  }catch(e){}
  const all=flatObjs(),hint=$('cauHint');
  if(!all.length){hint.textContent='Chưa có cầu. Bấm số 3–18 ở bàn phím ngay dưới là hiện ngay 3X / 11T lên ô đầu bên trái.';return;}
  const parts=COLS.map((c,i)=>c.length?`C${i+1}[${c.map(labelOf).join(' ')}]`:null).filter(Boolean);
  hint.textContent=`Bảng có ${all.length} mặt · ${COLS.length} cột · ${parts.join(' → ')} · con cuối ${labelOf(all[all.length-1])} = cầu ra HIỆN TẠI · CẦU HIỆN TẠI: ${detectCau(boardNums()).name}`;
}
/* Mô tả đúng thứ tự AI đọc bảng: KHÔNG rút gọn, KHÔNG bỏ sót ô nào,
   áp dụng cho MỌI kiểu cầu (bệt, 1-1, 3-2-1, 4-2-1-2-3, cầu lạ...) */
function usedCols(){return COLS.map((c,i)=>({c,i})).filter(x=>x.c.length);}
function readOrderText(){
  const used=usedCols();
  /* Giữ nguyên số thứ tự cột thật (kể cả khi có cột rỗng do bấm Chuyển hàng) */
  const parts=used.map(x=>`C${x.i+1}[${x.c.map(labelOf).join(' ')}]`);
  const f=flatObjs();
  const last=f.length?labelOf(f[f.length-1]):'—';
  const s=parts.join(' → ');   /* bỏ hẳn '…' / slice(0,2) / slice(-2) */
  return `Đọc bảng TRÁI→PHẢI, mỗi cột TRÊN→XUỐNG · ${f.length} mặt / ${used.length} cột · KHÔNG BỎ SÓT Ô NÀO: ${s||'trống'} · con cuối cùng ${last} = cầu ra HIỆN TẠI`;
}
/* Liệt kê từng mặt theo đúng thứ tự đọc, có đánh số 1..n để đối chiếu */
function fullListText(){
  const f=flatObjs();
  if(!f.length)return 'Bảng trống.';
  return f.map((o,i)=>`${i+1}.${labelOf(o)}`).join(' · ');
}
/* Tự kiểm: tổng số mặt trong từng cột phải KHỚP với số mặt engine quét */
function verifyReadText(){
  const used=usedCols(),sum=used.reduce((a,x)=>a+x.c.length,0),all=flatObjs().length;
  const per=used.map(x=>`C${x.i+1}(${x.c.length})`).join('+')||'0';
  return `Đối chiếu: ${per} = ${sum} mặt · engine quét ${all} mặt · ${sum===all?'KHỚP · KHÔNG SÓT':'⚠️ LỆCH, CẦN KIỂM LẠI'}`;
}
/* Dãy khối THEO CỘT (đúng cái bạn đếm: cột 1 có 4, cột 2 có 3...).
   Tách riêng với khối T/X để không lẫn 4-3-2-2-3 với 2-2-1-2-7. */
function colRunsText(){
  const u=usedCols();
  if(!u.length)return 'Chưa có cột nào có số.';
  return `Số ô từng cột: ${u.map(x=>`C${x.i+1}=${x.c.length}`).join(' + ')} = ${flatObjs().length} mặt · dãy khối cột ${u.map(x=>x.c.length).join('-')}`;
}

/* ===== BÀN PHÍM 3–18 + X (SÁT BẢNG) ===== */
(function buildKb(){
  let h='';
  for(let i=3;i<=18;i++)h+=`<button type="button" data-n="${i}">${i}</button>`;
  h+='<button type="button" class="del" data-del="1">X</button>';
  $('kb').innerHTML=h;
  $('kb').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{if(b.dataset.del)removeCurrentColumn();else addNum(+b.dataset.n);};
  });
})();
$('saveBoardBtn').onclick=()=>{
  const n=boardNums().length;
  saveBoard();
  LS.set('tx_saved_board',JSON.stringify({cols:COLS,at:Date.now()}));
  say(n?`Đã lưu cầu: ${n} mặt · ${COLS.length} cột. Bộ nhớ học vẫn giữ nguyên.`:'Bảng đang trống, chưa có gì để lưu.');
};
$('delColBtn').onclick=removeCurrentColumn;
$('shiftCol').onclick=shiftCol;
$('clrCau').onclick=clearBoard;
$('seed').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault();});

/* ===== NHẬN DIỆN MỌI CẦU · TỰ TÌM CHU KỲ, KHÔNG LIỆT KÊ CỨNG =====
   Cầu = chuỗi KHỐI cùng mặt: 3T 2X 1T -> "3-2-1" (hoặc 3X 2T 1X). */
function rle(arr){
  const runs=[],sides=[];
  for(let i=0;i<arr.length;){let j=i;while(j<arr.length&&arr[j]===arr[i])j++;runs.push(j-i);sides.push(arr[i]);i=j;}
  return {runs:runs,sides:sides};
}
function detectCau(nums){
  const n=nums.length,tx=nums.map(sideOf);
  if(!n)return {name:'Chưa có cầu',id:'empty',certain:false,cycle:null,cycleStr:'',repeat:0,runs:[],sides:[],
                tCount:0,xCount:0,flips:0,flipRate:0,balance:1,key:'empty',pattern:'Chưa có cầu'};
  const t=tx.filter(v=>v==='T').length,x=n-t;
  let flips=0;for(let i=1;i<n;i++)if(tx[i]!==tx[i-1])flips++;
  const flipRate=n>1?flips/(n-1):0,balance=Math.abs(t-x)/n;
  const rl=rle(tx),runs=rl.runs,sides=rl.sides;
  let cycle=null,repeat=0;
  for(let p=1;p<=Math.min(12,Math.floor(n/2));p++){
    let ok=true;
    for(let i=p;i<n;i++){if(tx[i]!==tx[i%p]){ok=false;break;}}
    if(ok){cycle=tx.slice(0,p);repeat=Math.floor(n/p);break;}
  }
  const certain=n>=6&&cycle!==null&&repeat>=2;
  let name,id;
  if(certain&&cycle.every(v=>v===cycle[0])){
    name=`Cầu bệt ${cycle[0]==='T'?'Tài':'Xỉu'} ${n} tay`;id='Bệt'+(cycle[0]==='T'?'T':'X');
  }else if(certain){
    const c=rle(cycle),rr=c.runs,ss=c.sides;
    id=rr.join('-');
    const detail=rr.map((v,i)=>v+(ss[i]==='T'?'T':'X')).join(' ');
    name=(id==='1-1')?`Cầu 1-1 (đảo đều ${n} nhịp)`:`Cầu ${id} (${detail})`;
    name+=` · lặp ${repeat} lần`;
  }else{
    /* Hiện TOÀN BỘ khối (không cắt 6/8 khối cuối) → cầu lạ, cầu dài vẫn không sót */
    name=`Chưa bắt được cầu (chuỗi khối ${runs.join('-')})`;
    id='R'+runs.join('-');
  }
  return {name:name,id:id,certain:certain,cycle:cycle,cycleStr:cycle?cycle.join(''):'',repeat:repeat,
          runs:runs,sides:sides,tCount:t,xCount:x,flips:flips,flipRate:flipRate,balance:balance,
          key:id,pattern:name};
}

/* ===== HỌC TỪ ĐÚNG / SAI (theo TÊN CẦU) — lưu riêng, KHÔNG bị xoá bởi "Xoá bộ nhớ" ===== */
function learn(key,predicted,isOk){
  const actual=isOk?predicted:(predicted==='TÀI'?'XỈU':'TÀI');
  if(!STATS[key])STATS[key]={tai:0,xiu:0,ok:0,wrong:0,total:0};
  const s=STATS[key];
  if(actual==='TÀI')s.tai++;else s.xiu++;
  if(isOk)s.ok++;else s.wrong++;
  s.total++;LS.set('tx_stats',JSON.stringify(STATS));
  return actual;
}
function buildLesson(ana,nums,adv){
  const s=STATS[ana.key];
  const wrongRecent=HIST.filter(h=>h.marked&&!h.isOk).slice(-3);
  const sum=nums.reduce((a,b)=>a+b,0),avg=nums.length?sum/nums.length:0;
  let t=`CẦU HIỆN TẠI (tool đo từ bảng):\n`;
  t+=`· ${nums.length} mặt, Tài ${ana.tCount} / Xỉu ${ana.xCount}, tổng ${sum}, trung bình ${avg.toFixed(1)}.\n`;
  t+=`· Toàn bộ chuỗi đã đọc (${nums.length} mặt, không bỏ sót): ${nums.map((v,i)=>`${i+1}.${v}${sideOf(v)}`).join(' · ')}.\n`;
  t+=`· Đối chiếu lúc bấm DỰ ĐOÁN: ${nums.length} mặt, đã liệt kê đủ vị trí 1..${nums.length} ở trên.\n`;
  t+=`· ${ana.name} · đảo chiều ${ana.flips} lần (${Math.round(ana.flipRate*100)}%).\n`;
  t+=`· ${adv.certain?'Cầu rõ, đã bắt được chu kỳ lặp → đã chốt 1 cửa.':'CHƯA ĐỦ DỮ LIỆU: chưa lặp đủ chu kỳ hoặc tín hiệu nhiễu → không chốt cửa.'}\n`;
  t+=`\nKINH NGHIỆM SAU CÁC LẦN ĐOÁN SAI:\n`;
  if(s&&s.total>=1){
    t+=`· Cầu [${ana.key}] đã gặp ${s.total} lần: đúng ${s.ok}, SAI ${s.wrong}; thực tế nghiêng ${s.tai>=s.xiu?'TÀI':'XỈU'} (${s.tai}T / ${s.xiu}X).\n`;
    if(s.wrong>0)t+=`· ${s.wrong} lần đoán trượt ở cầu này → phải nhìn lại game đang chạy hướng nào, không lặp sai cũ.\n`;
  }else t+=`· Cầu [${ana.key}] chưa có kinh nghiệm → độ tin mức vừa.\n`;
  if(wrongRecent.length)t+=`· Các lần SAI gần đây: ${wrongRecent.map(h=>`[${h.patternKey}] đoán ${h.verdict} nhưng ra ${h.actual}`).join(' · ')}.\n`;
  return t;
}

/* ===== CHẮC MỚI ĐOÁN · CẦU KHÓ / CHƯA RÕ → KHÔNG ĐOÁN · BỎ HẲN CƠ CHẾ CHỜ TAY =====
   Chế độ cầu khó đã GỘP CHUNG: tool tự nhận diện, không còn nút riêng. */
function judgeConfidence(nums,ana){
  let risk=0;const why=[];
  if(!ana.certain){risk+=4;why.push('chưa tìm được chu kỳ lặp của các khối');}
  if(ana.flipRate>0.6){risk+=1;why.push('đảo chiều '+ana.flips+' nhịp');}
  const s=STATS[ana.key];
  if(!s||s.total<3)risk+=1;
  else if(s.ok/s.total<0.45)risk+=1;
  /* cầu khó = đảo dày hoặc pattern này từng đoán trượt nhiều → vẫn coi là chưa đủ tín hiệu */
  const hard=ana.flipRate>0.6||(s&&s.total>=3&&s.ok/s.total<0.45);
  const certain=ana.certain&&nums.length>=6&&!hard;
  const text=certain
    ? `ĐANG ĐI CẦU: ${ana.name} → đã lặp ${ana.repeat} lần, tín hiệu rõ. CHỐT DỰ ĐOÁN NGAY.`
    : `CHƯA ĐỦ DỮ LIỆU · ${ana.name} → KHÔNG DỰ ĐOÁN. Nhập thêm tay để tool bắt được chu kỳ.`;
  return {risk,certain,hard,text,why};
}

/* ===== ENGINE LAI 0MB · tính 0.01s · trình bày ~15s (tối đa 20s) ===== */
let predicting=false,cancelled=false,stepTimer=null,watchTimer=null;
let t0=0,currentLines=[],curDec=null,curAna=null,curAdv=null,curNums=[];
function deepStats(nums){
  const tx=nums.map(sideOf),n=tx.length;
  const t=tx.filter(v=>v==='T').length,x=n-t;
  let streak=1;
  for(let k=n-2;k>=0;k--){if(tx[k]===tx[n-1])streak++;else break;}
  const last=tx[n-1]==='T'?'TÀI':'XỈU';
  let tt=0,tx_=0,xt=0,xx=0;
  for(let k=1;k<n;k++){
    const a=tx[k-1],b=tx[k];
    if(a==='T'&&b==='T')tt++;
    else if(a==='T'&&b==='X')tx_++;
    else if(a==='X'&&b==='T')xt++;
    else xx++;
  }
  const fromT=tt+tx_,fromX=xt+xx;
  const pTT=fromT?Math.round(tt/fromT*100):50,pXT=fromX?Math.round(xt/fromX*100):50;
  const r5=tx.slice(-5),r10=tx.slice(-10);
  const r5t=r5.filter(v=>v==='T').length,r10t=r10.filter(v=>v==='T').length;
  const freq={};nums.forEach(v=>{freq[v]=(freq[v]||0)+1;});
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const sum=nums.reduce((a,b)=>a+b,0),avg=n?sum/n:0;
  return {n,t,x,last,streak,tt,tx:tx_,xt,xx,pTT,pXT,
          r5t,r5n:r5.length,r10t,r10n:r10.length,top,sum,avg,
          lastNum:nums[n-1],pTaiFromLast:last==='TÀI'?pTT:pXT};
}
function decide(nums,ana){
  const d=deepStats(nums);
  let score=50;const why=[];
  const b10=(d.r10t/d.r10n-0.5)*40;score+=b10;
  why.push(`10 tay gần ${d.r10t}T/${d.r10n-d.r10t}X → ${b10>=0?'+':''}${b10.toFixed(0)} điểm`);
  const bTr=(d.pTaiFromLast-50)*0.45;score+=bTr;
  why.push(`Sau ${d.last} ra TÀI ${d.pTaiFromLast}% → ${bTr>=0?'+':''}${bTr.toFixed(0)} điểm`);
  if(d.streak>=4){score+=d.last==='TÀI'?-10:10;why.push(`Bệt ${d.streak} tay ${d.last} → bệt dài dễ gãy, tính đảo`);}
  else if(d.streak>=2){score+=d.last==='TÀI'?6:-6;why.push(`Bệt ${d.streak} tay ${d.last} → quán tính nhẹ`);}
  if(ana.flipRate>0.7){score=50+(score-50)*0.55;why.push(`Đảo ${ana.flips}/${nums.length-1} nhịp → nén biên độ`);}
  else if(ana.id==='1-1')why.push('Cầu 1-1 → ưu tiên nhịp đảo');
  const bSum=(d.avg-10.5)*1.6;score+=bSum;
  why.push(`TB tổng ${d.avg.toFixed(1)} (chuẩn 10.5) → ${bSum>=0?'+':''}${bSum.toFixed(0)} điểm`);
  const s=STATS[ana.key];let lessonLine='';
  if(s&&s.total>=1){
    if(s.wrong>s.ok){score=100-score;lessonLine=`⚠️ Cầu [${ana.key}] từng SAI ${s.wrong}/${s.total} → ĐẢO hướng, không lặp sai cũ`;}
    else{const lean=s.tai>=s.xiu?'TÀI':'XỈU';score+=lean==='TÀI'?7:-7;lessonLine=`✅ Cầu [${ana.key}] đúng ${s.ok}/${s.total} → nghiêng ${lean}, cộng 7 điểm`;}
  }else lessonLine=`Cầu [${ana.key}] chưa có kinh nghiệm → độ tin vừa`;
  score=Math.max(12,Math.min(88,score));
  const verdict=score>=50?'TÀI':'XỈU';
  let pct=Math.round(Math.max(50,Math.min(82,50+Math.abs(score-50)*0.9)));
  if(s&&s.wrong>s.ok)pct=Math.max(50,pct-6);
  return {d,score,verdict,pct,why,lessonLine};
}
function buildSteps(nums,ana,adv,dec,extra){
  const d=dec.d,L=[];
  L.push(`📥 ${readOrderText()}`);
  L.push(`📋 TOÀN BỘ ${nums.length} MẶT THEO THỨ TỰ ĐỌC (không sót ô nào):\n   ${fullListText()}`);
  L.push(`✅ ${verifyReadText()}`);
  L.push(`🗂️ ${colRunsText()}`);
  L.push(`🏷️ CẦU HIỆN TẠI: ${ana.name}`);
  L.push(`🧩 Khối T/X (liên tiếp cùng mặt, KHÁC với khối cột ở trên): ${ana.runs.map((v,i)=>v+(ana.sides[i]==='T'?'T':'X')).join(' · ')} · dãy ${ana.runs.join('-')} · chu kỳ ${ana.cycle?'['+ana.cycleStr+'] lặp '+ana.repeat+' lần':'chưa bắt được'}`);
  L.push(`📈 Xu hướng: 10 tay ${d.r10t}T/${d.r10n-d.r10t}X · 5 tay ${d.r5t}T/${d.r5n-d.r5t}X`);
  L.push(`🔄 Ma trận: T→T ${d.tt} · T→X ${d.tx} · X→T ${d.xt} · X→X ${d.xx} → sau ${d.last} ra TÀI ${d.pTaiFromLast}%`);
  L.push(`🎯 Cửa cuối ${d.last} · bệt ${d.streak} tay · đảo ${ana.flips}/${Math.max(1,nums.length-1)} nhịp (${Math.round(ana.flipRate*100)}%)`);
  L.push(`🎲 Tần suất tổng: ${d.top.map(([v,f])=>`${v} (${f})`).join(' · ')} · TB ${d.avg.toFixed(1)}`);
  L.push(`⚖️ Cộng trọng số: ${dec.why[0]} | ${dec.why[1]} | ${dec.why[dec.why.length-1]}`);
  L.push(`🧠 Kinh nghiệm: ${dec.lessonLine}`);
  L.push(adv.certain?`✅ Cầu rõ → CHỐT NGAY`:`⛔ CHƯA ĐỦ DỮ LIỆU → KHÔNG DỰ ĐOÁN`);
  if(extra&&adv.certain){
    L.push(`🔍 Rà lại: T/X chênh ${Math.abs(d.t-d.x)} mặt · cân bằng ${(ana.balance*100).toFixed(0)}%`);
    L.push(`🧩 Điểm thô ${dec.score.toFixed(1)} → nghiêng ${dec.verdict} · độ tin ${dec.pct}%`);
  }
  L.push(adv.certain
    ? `✅ CHỐT 1 CỬA: ${dec.verdict} ${dec.pct}% · ĐANG ĐI CẦU: ${ana.name}`
    : `⛔ KẾT LUẬN: CHƯA ĐỦ DỮ LIỆU · KHÔNG DỰ ĐOÁN · nhập thêm tay`);
  return L;
}
function paint(lines,upto,nums){
  const sec=(performance.now()-t0)/1000;
  const stat=`📡 ${nums.length} mặt (đọc hết, không sót) · tính 0.01s · bước ${upto}/${lines.length} · ${sec.toFixed(1)}s · 0MB · luồng nhẹ, vẫn lướt được`;
  $('rThink').innerHTML='<div style="white-space:pre-wrap">'+esc(lines.slice(0,upto).join('\n'))+'</div><div id="tkStat">'+esc(stat)+'</div>';
  $('rThink').scrollTop=$('rThink').scrollHeight;
  fill.style.width=Math.round(upto/lines.length*100)+'%';
  detail.textContent=stat;
}
function finish(forced){
  if(!predicting)return;
  clearTimeout(stepTimer);clearTimeout(watchTimer);
  predicting=false;load.style.display='none';
  $('go').disabled=false;$('go').textContent='DỰ ĐOÁN';
  $('cancelBtn').style.display='none';
  const sec=((performance.now()-t0)/1000).toFixed(1);
  const foot=`\n\n📡 Dữ liệu thật: đã quét TOÀN BỘ ${curNums.length}/${curNums.length} mặt (snapshot lúc bấm, không sót) · tính 0.01s · trình bày ${sec}s · 0MB · không WASM${forced?' · chốt ở mốc 20s':''}`;
  $('rThink').textContent=currentLines.join('\n')+'\n\n'+buildLesson(curAna,curNums,curAdv)+foot;
  $('rAdvice').textContent=curAdv.text;
  /* Chưa đủ dữ liệu / cầu khó: KHÔNG đưa dự đoán, không ghi cửa, không tạo phiên */
  if(!curAdv.certain){
    $('concl').innerHTML='<small>KẾT QUẢ CUỐI CÙNG</small>CHƯA ĐỦ DỮ LIỆU · KHÔNG DỰ ĐOÁN';
    $('rPct').textContent=`— · ${curAna.name}. Tool chỉ chốt khi bắt được chu kỳ cầu lặp lại.`;
    say('Chưa đủ dữ liệu / cầu khó → KHÔNG dự đoán. Nhập thêm tay rồi bấm lại.');
    return;
  }
  const d=curDec;
  /* Có dự đoán → BẮT BUỘC ghi rõ đang đi cầu gì ngay dưới kết quả */
  $('concl').innerHTML=`<small>KẾT QUẢ CUỐI CÙNG · ĐANG ĐI CẦU: ${esc(curAna.name)}</small>DỰ ĐOÁN: ${d.verdict} ${d.pct}%`;
  const pt=d.verdict==='TÀI'?d.pct:100-d.pct,px=100-pt;
  $('rPct').textContent=`TÀI ${pt}%  ·  XỈU ${px}%  →  chốt ${d.verdict} (${d.pct}%)\nĐang chạy cầu: ${curAna.name}`;
  HIST.push({nums:curNums,verdict:d.verdict,pct:d.pct,patternKey:curAna.key,marked:false,actual:null,isOk:null,cau:curAna.name});
  LS.set('tx_hist',JSON.stringify(HIST));
  updateStats();renderHist();
}
$('go').onclick=()=>{
  const nums=boardNums();
  if(!nums.length){say('Bảng cầu chưa có số. Bấm phím 3–18 để hiện lên bảng.');return;}
  if(predicting)return;
  predicting=true;cancelled=false;
  banner.style.display='none';
  $('go').disabled=true;$('go').textContent='Đang phân tích…';
  $('cancelBtn').style.display='block';
  $('res').style.display='block';
  $('rAdvice').textContent='';
  $('concl').innerHTML='<small>KẾT QUẢ CUỐI CÙNG</small>ĐANG SUY NGHĨ…';
  $('rPct').textContent='';
  try{$('res').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(_){}
  HIST=HIST.filter(h=>h.marked);
  curNums=nums;
  curAna=detectCau(nums);
  curAdv=judgeConfidence(nums,curAna);
  curDec=decide(nums,curAna);
  const extra=curAdv.risk>=5;   /* cầu khó tự thêm 2 bước rà soát — đã gộp, không còn nút bật */
  currentLines=buildSteps(nums,curAna,curAdv,curDec,extra);
  t0=performance.now();
  load.style.display='block';loadtext.textContent='Đang phân tích cầu…';fill.style.width='0%';
  let k=0;
  (function tick(){
    if(cancelled||!predicting)return;
    if(k<currentLines.length){paint(currentLines,k+1,nums);k++;stepTimer=setTimeout(tick,1500);}
    else finish(false);
  })();
  clearTimeout(watchTimer);
  watchTimer=setTimeout(()=>{if(predicting&&!cancelled)finish(true);},20000);
};
$('cancelBtn').onclick=()=>{
  if(!predicting)return;
  cancelled=true;clearTimeout(stepTimer);clearTimeout(watchTimer);
  predicting=false;load.style.display='none';
  $('go').disabled=false;$('go').textContent='DỰ ĐOÁN';
  $('cancelBtn').style.display='none';
  $('concl').innerHTML='<small>KẾT QUẢ CUỐI CÙNG</small>ĐÃ HUỶ';
  $('rPct').textContent='Bấm DỰ ĐOÁN để chạy lại.';
  say('Đã HUỶ thật: dừng hẳn timer, không còn chạy nền.');
};
$('retryBtn').onclick=()=>{$('go').click();};
$('aiBtn').onclick=()=>{say('AI lai đã bật sẵn: 0MB, tự nhận diện mọi cầu và tự xử lý cầu khó (không còn nút riêng). Bấm DỰ ĐOÁN là chạy ngay.');};
window.markResult=(idx,isOk)=>{
  const h=HIST[idx];if(!h||h.marked)return;
  const actual=learn(h.patternKey,h.verdict,isOk);
  h.marked=true;h.isOk=isOk;h.actual=actual;
  if(isOk)OKN++;TOTN++;
  LS.set('tx_hist',JSON.stringify(HIST));LS.set('tx_ok',OKN);LS.set('tx_tot',TOTN);
  updateStats();renderHist();
  say(isOk
    ?`Đã lưu: cầu [${h.patternKey}] đoán ${h.verdict} ĐÚNG → lần sau giữ hướng, cộng trọng số.`
    :`Đã học: [${h.patternKey}] đoán ${h.verdict} SAI, thực tế ${actual}. Lần tới engine ĐẢO trọng số + hạ độ tin.`);
};
/* XOÁ BỘ NHỚ = chỉ xoá lịch sử ĐÚNG/SAI + đưa 3 thống kê về 0.
   Bộ nhớ học tập AI (STATS / tx_stats) GIỮ NGUYÊN. */
$('resetMem').onclick=()=>{
  HIST=[];OKN=0;TOTN=0;showAll=false;
  LS.set('tx_hist','[]');LS.set('tx_ok','0');LS.set('tx_tot','0');
  updateStats();renderHist();
  say('Đã xoá toàn bộ lịch sử ĐÚNG/SAI. Phiên / Độ đúng / Tỉ lệ Tài về 0. Bộ nhớ học của AI vẫn giữ nguyên.');
};
$('toggleHist').onclick=()=>{showAll=!showAll;renderHist();};
function updateStats(){
  $('tot').textContent=HIST.length;
  $('acc').textContent=TOTN?Math.round(OKN/TOTN*100)+'%':'0%';
  const tai=HIST.filter(h=>h.verdict==='TÀI').length;
  $('rate').textContent=HIST.length?Math.round(tai/HIST.length*100)+'%':'0%';
}
function renderHist(){
  const list=showAll?HIST.slice(-3):HIST.slice(-1);
  $('histPred').innerHTML=list.slice().reverse().map((h,i)=>{
    const idx=showAll?(HIST.length-1-i):(HIST.length-1);
    const numTxt=(h.nums||[]).map(n=>n+sideOf(n)).join(' ');
    const head=`<div class="hi-main"><span>${esc(numTxt)} → <b>${h.verdict}</b> ${h.pct}%</span></div>`;
    const cau=h.cau?`<div class="hi-note">Cầu: ${esc(h.cau)}</div>`:'';
    const foot=h.marked
      ?`<div class="hi-done">${h.isOk?'ĐÚNG':'SAI'} · thực tế <b>${h.actual}</b> · đã học cầu [${h.patternKey}]</div>`
      :`<div class="hi-actions"><button onclick="markResult(${idx},true)">ĐÚNG</button><button onclick="markResult(${idx},false)">SAI</button></div><div class="hi-note">Chưa đánh giá → engine chưa học nước này</div>`;
    return `<div class="hi-item">${head}${cau}${foot}</div>`;
  }).join('')||'<div class="hi-note">Chưa có phiên nào. Bấm DỰ ĐOÁN rồi đánh giá để AI học.</div>';
  $('toggleHist').textContent=showAll?'Chỉ hiện 1 dự đoán':(HIST.length>1?'Xem 3 phiên trước':'Xem các phiên trước');
}
loadBoard();renderBoard();updateStats();renderHist();
$('mode').textContent='● AI lai · sẵn sàng';
</script>
